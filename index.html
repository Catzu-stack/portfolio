  const links=projectLink(p.github,'GitHub')+projectLink(p.demo,t.live);
  const images=p.screenshots.map((src,i)=>`<img src="${escapeHTML(src)}" alt="${escapeHTML(p.name)} — ${t.screenshot} ${i+1}" loading="lazy" decoding="async">`).join('');
  $('#modal-content').innerHTML=`<button type="button" class="modal-close" aria-label="${t.close}">✕</button><div class="kicker">${t.projectKicker} ${String(p.index+1).padStart(2,'0')} · M.SUZUKI</div>${artMarkup(p)}${p.screenshots.length?'':`<div class="preview-label">${p.type==='website'?t.plannedPreview:t.notReal}</div>`}<h2 id="modal-title">${p.name}</h2><span class="detail-category">${p.category}</span><h3>${t.detail}</h3><p>${p.overview}</p><h3>${t.purpose}</h3><p>${p.purpose}</p><h3>${t.features}</h3><ul>${p.features.map(v=>`<li>${v}</li>`).join('')}</ul><h3>${t.tech}</h3>${techMarkup(p)}<h3>${t.statusLabel}</h3><p>${p.status}</p><h3>${t.links}</h3>${links?`<div class="actions">${links}</div>`:`<p>${t.noLinks}</p>`}<h3>${t.screens}</h3><div class="detail-screens">${images||`<p>${t.noScreens}</p>`}</div>`;
  const modal=$('#project-modal'); modal.classList.add('open'); modal.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
  [app,$('.topbar'),$('.footer'),$('#skip-link')].forEach(el=>el.inert=true);
  $('#modal-content').scrollTop=0; $('.modal-close').focus(); $('.modal-close').addEventListener('click',()=>closeModal());
}
function closeModal(restore=true) {
  const modal=$('#project-modal'); modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); document.body.style.overflow='';
  [app,$('.topbar'),$('.footer'),$('#skip-link')].forEach(el=>el.inert=false);
  openProjectId=null;
  if(restore&&lastFocus?.isConnected)lastFocus.focus({preventScroll:true}); lastFocus=null;
}
function bindForm() {
  const form=$('#contact-form'),status=$('#form-status'),button=form.querySelector('button[type="submit"]'),t=tr();
  form.addEventListener('submit',async e=>{
    e.preventDefault(); status.className='form-status'; const data=new FormData(form), email=String(data.get('email')||'').trim();
    if(data.get('website'))return;
    if(!form.checkValidity()||!['name','subject','message'].every(k=>String(data.get(k)||'').trim())||! /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {status.textContent=t.formInvalid;status.classList.add('error');return;}
    const endpoint=safeURL(siteConfig.contactEndpoint);
    if(!endpoint){status.textContent=t.formPending;return;}
    button.disabled=true;status.textContent=t.sending;
    try {const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name:data.get('name'),email,subject:data.get('subject'),message:data.get('message')})}); if(!response.ok)throw new Error('Submission failed');status.textContent=t.sent;status.classList.add('success');form.reset();}
    catch{status.textContent=t.failed;status.classList.add('error');}finally{button.disabled=false;}
  });
}
function observeReveals() {
  revealObserver?.disconnect(); const els=document.querySelectorAll('.reveal:not(.visible)');
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion: reduce)').matches){els.forEach(e=>e.classList.add('visible'));return;}
  revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');revealObserver.unobserve(entry.target);}}),{threshold:.12});els.forEach(e=>revealObserver.observe(e));
}
$('#lang-toggle').addEventListener('click',()=>{
  const form=$('#contact-form'),draft=form?Object.fromEntries(new FormData(form)):null,id=openProjectId;
  lang=lang==='fr'?'en':'fr';try{localStorage.setItem('og-lang',lang);}catch{} render({keepScroll:true,draft});
  if(id)showProject(id,document.querySelector(`[data-project="${id}"] .card-action`));
});
$('#menu-toggle').addEventListener('click',()=>setMenu(!$('#mobile-nav').classList.contains('open')));
$('#mobile-nav').addEventListener('click',e=>{if(e.target.closest('a'))setMenu(false);});
$('#skip-link').addEventListener('click',e=>{e.preventDefault();app.focus();});
window.addEventListener('hashchange',()=>{if(pageFromHash()!=='projects'||currentPage!=='projects')activeFilter='all';render({focusPage:true});});
$('#project-modal').addEventListener('click',e=>{if(e.target===$('#project-modal'))closeModal();});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(openProjectId)closeModal();else if($('#mobile-nav').classList.contains('open')){setMenu(false);$('#menu-toggle').focus();}}
  if(e.key==='Tab'&&openProjectId){const focusable=[...$('#modal-content').querySelectorAll('button:not([disabled]),a[href]')];const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
$('#year').textContent=new Date().getFullYear(); render();

</script>
</body>
