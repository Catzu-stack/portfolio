function socialItem(label,key,t){const raw=siteConfig.socials[key];let url='';try{const parsed=new URL(raw);if(parsed.protocol==='https:')url=parsed.href}catch{}const content=`<span>${label}</span><span>${url?'↗':`URL ${t.notLinked}`}</span>`;return url?`<a class="social-item" href="${url}" target="_blank" rel="noopener noreferrer">${content}</a>`:`<div class="social-item">${content}</div>`}
function contactView(){const t=translations[lang];return `<div class="wrap"><section class="page-intro"><div class="kicker">CONTACT · OPEN TO CONVERSATION</div><h1 class="page-title">${t.contactTitle}</h1><p>${t.contactIntro}</p></section><section class="content-section"><div class="contact-layout"><div class="contact-note"><h2>${t.contactLabel}</h2><p>${t.contactBody}</p><div class="social-list">${socialItem(t.socialGithub,'github',t)}${socialItem(t.socialLinkedin,'linkedin',t)}${socialItem(t.socialYoutube,'youtube',t)}</div></div><form class="contact-form" id="contact-form" novalidate><div class="form-row"><div class="field"><label for="name">${t.name} *</label><input id="name" name="name" required autocomplete="name" placeholder="${t.placeholderName}"></div><div class="field"><label for="email">${t.email} *</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="${t.placeholderEmail}"></div></div><div class="field"><label for="subject">${t.subject} *</label><input id="subject" name="subject" required placeholder="${t.placeholderSubject}"></div><div class="field"><label for="message">${t.message} *</label><textarea id="message" name="message" required placeholder="${t.placeholderMessage}"></textarea></div><label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button class="btn btn-primary" type="submit">${t.send}<span class="arrow">→</span></button><p class="form-status" id="form-status" role="status" aria-live="polite"></p></form></div></section></div>`}
function render(){currentPage=pageFromHash();document.documentElement.lang=lang;updateNav();const views={home:homeView,about:aboutView,projects:projectsView,skills:skillsView,contact:contactView};app.innerHTML=views[currentPage]();document.title=`${translations[lang].nav[['home','about','projects','skills','contact'].indexOf(currentPage)]} — M.SUZUKI | AI & Software`;if(currentPage==='projects')bindFilters();if(currentPage==='contact')bindForm();bindCards();observeReveals();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function bindFilters(){document.querySelectorAll('.filter-btn').forEach(btn=>btn.addEventListener('click',()=>{activeFilter=btn.dataset.filter;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('.project-card').forEach(card=>card.hidden=activeFilter!=='all'&&card.dataset.type!==activeFilter)}))}
function bindCards(){document.querySelectorAll('.project-card').forEach(card=>{const open=()=>showProject(Number(card.dataset.project));card.addEventListener('click',open);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})})}
function projectLink(url,label,t){let safe='';try{const parsed=new URL(url);if(parsed.protocol==='https:')safe=parsed.href}catch{}return safe?`<a class="tag" href="${safe}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:`<span class="tag">${label}: ${t.notLinked}</span>`}
function showProject(id){const p=projectsData()[id],t=translations[lang];lastFocus=document.activeElement;$('#modal-content').innerHTML=`<button class="modal-close" aria-label="${t.close}">✕</button><div class="kicker">PROJECT 0${id+1} · M.SUZUKI</div>${artMarkup(id)}<h2 id="modal-title">${p.name}</h2><span class="detail-category">${p.category}</span><h3>${t.detail}</h3><p>${p.description}</p><h3>${t.tech}</h3><div class="tags">${p.techs.map(x=>`<span class="tag">${x}</span>`).join('')}</div><h3>${t.statusLabel}</h3><p>${p.status}</p><h3>GitHub · ${lang==='fr'?'Démo en ligne':'Live demo'}</h3><div class="tags">${projectLink(p.github,'GitHub',t)}${projectLink(p.demo,lang==='fr'?'Démo en ligne':'Live demo',t)}</div><h3>${lang==='fr'?'Captures d’écran':'Screenshots'}</h3><div class="detail-screens">${p.screenshots.length?p.screenshots.map(src=>`<img src="${src}" alt="${p.name} — ${lang==='fr'?'capture du projet':'project screenshot'}" loading="lazy" decoding="async">`).join(''):`<p>${t.notLinked}</p>`}</div><p class="modal-note">${t.notReal}</p>`;$('#project-modal').classList.add('open');document.body.style.overflow='hidden';$('.modal-close').focus();$('.modal-close').addEventListener('click',closeModal)}
function closeModal(){const modal=$('#project-modal');modal.classList.remove('open');document.body.style.overflow='';if(lastFocus)lastFocus.focus()}
function bindForm(){const form=$('#contact-form'),status=$('#form-status'),button=form.querySelector('button[type="submit"]'),t=translations[lang];form.addEventListener('submit',async e=>{e.preventDefault();status.className='form-status';const data=new FormData(form),email=String(data.get('email')||''),emailParts=email.split('@');const valid=form.elements.name.value.trim()&&emailParts.length===2&&emailParts[0].length>0&&emailParts[1].includes('.')&&form.elements.subject.value.trim()&&form.elements.message.value.trim();if(data.get('website')){status.textContent='';return}if(!valid){status.textContent=t.formInvalid;status.classList.add('error');form.reportValidity();return}if(!siteConfig.contactEndpoint){status.textContent=t.formPending;status.classList.add('error');return}button.disabled=true;status.textContent=lang==='fr'?'Envoi en cours…':'Sending…';try{const response=await fetch(siteConfig.contactEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name:data.get('name'),email,subject:data.get('subject'),message:data.get('message')})});if(!response.ok)throw new Error('Submission failed');status.textContent=lang==='fr'?'Message envoyé. Merci !':'Message sent. Thank you!';status.classList.add('success');form.reset()}catch(error){status.textContent=lang==='fr'?'Échec de l’envoi. Réessayez plus tard.':'Could not send your message. Please try again later.';status.classList.add('error')}finally{button.disabled=false}})}
function observeReveals(){const els=document.querySelectorAll('.reveal');if(!('IntersectionObserver'in window)||matchMedia('(prefers-reduced-motion: reduce)').matches){els.forEach(e=>e.classList.add('visible'));return}const obs=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');obs.unobserve(entry.target)}}),{threshold:.12});els.forEach(e=>obs.observe(e))}
$('#lang-toggle').addEventListener('click',()=>{lang=lang==='fr'?'en':'fr';localStorage.setItem('og-lang',lang);render()});$('#menu-toggle').addEventListener('click',()=>{$('#mobile-nav').classList.toggle('open');$('#menu-toggle').setAttribute('aria-expanded',$('#mobile-nav').classList.contains('open'))});$('#mobile-nav').addEventListener('click',e=>{if(e.target.closest('a'))$('#mobile-nav').classList.remove('open')});window.addEventListener('hashchange',render);$('#project-modal').addEventListener('click',e=>{if(e.target===$('#project-modal'))closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#project-modal').classList.contains('open'))closeModal()});$('#year').textContent=new Date().getFullYear();render();
</script>
</body>
</html>
